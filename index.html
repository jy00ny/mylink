<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyLink</title>
<style>
  :root {
    --bg: #f3f6fb; --card: #ffffff; --text: #17202e; --sub: #5b6678; --accent: #2f5bea; --line: #dbe2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --card: #1a202b; --text: #eef2f8; --sub: #9aa6ba; --accent: #7d9bff; --line: #2b3444; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 440px; padding: 56px 20px 40px; text-align: center; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px;
    background: var(--accent); color: #fff; font-size: 36px; font-weight: 700;
    display: grid; place-items: center;
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p.bio { margin: 0 0 32px; color: var(--sub); line-height: 1.6; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.link {
    display: block; padding: 16px; border-radius: 12px; text-decoration: none;
    background: var(--card); color: var(--text); border: 1px solid var(--line); font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } a.link:hover { transform: none; } }
  footer { margin-top: 36px; font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<main>
  <div class="avatar">M</div>
  <h1>내 이름</h1>
  <p class="bio">안녕하세요! 제 링크 모음입니다.</p>
  <ul>
    <!-- 아래 href와 이름을 본인 정보로 바꾸세요 -->
    <li><a class="link" href="https://github.com/내아이디" target="_blank" rel="noopener">GitHub</a></li>
    <li><a class="link" href="https://www.instagram.com/내아이디" target="_blank" rel="noopener">Instagram</a></li>
    <li><a class="link" href="https://blog.naver.com/내아이디" target="_blank" rel="noopener">블로그</a></li>
    <li><a class="link" href="mailto:me@example.com">이메일 보내기</a></li>
  </ul>
  <footer>© MyLink</footer>
</main>
</body>
</html>
